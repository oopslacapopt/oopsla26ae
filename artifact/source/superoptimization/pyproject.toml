[project]
name = "capopt"
version = "0.1.0"
description = "CapOpt: Capability-Aware Superoptimizer for CHERI"
requires-python = ">=3.11"
dependencies = [
    "z3-solver>=4.8.0",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "sympy>=1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=3.0.0",
]
viz = [
    "matplotlib>=3.5.0",
    "pandas>=1.3.0",
]
# C++ backend (capopt._native._kernels). Build it in place with
#   python3 capopt/_native/build_native.py
# after installing this extra; without it the package transparently uses
# the pure-Python fallback in capopt/_native/_fallback.py.
native = [
    "pybind11>=2.11",
]

[project.scripts]
capopt = "capopt.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
